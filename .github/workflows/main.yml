name: Build Fast Document Reader APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v5

      - name: 2. Set up Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 4. Run unit tests (HWP/HWPX 파서)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 5. Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 6. Upload APK Artifact (스마트폰 다운로드용)
        uses: actions/upload-artifact@v5
        with:
          name: FastDocReader-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: 7. Publish GitHub Release (v* 태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "FastDocReader-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "FastDocReader-${TAG}.apk" --clobber
          else
            gh release create "$TAG" "FastDocReader-${TAG}.apk" --title "$TAG" --generate-notes
          fi

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
